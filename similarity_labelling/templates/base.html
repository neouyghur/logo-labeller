<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Similarity Study</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #dcdcd6;
    --yes: #1f7a4d; --no: #b3261e; --unsure: #8a6d00; --focus: #2457c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ecece8; --muted: #a3a39c; --card: #22221f; --line: #3a3a36;
      --yes: #4cc08a; --no: #f2817a; --unsure: #e0c040; --focus: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center;
           gap: 12px; color: var(--muted); font-size: 14px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 20px; }
  .bar > div { height: 100%; background: var(--focus); border-radius: 2px; }
  .question { font-size: 20px; font-weight: 600; text-align: center; margin: 0 0 16px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  /* logo panels stay white in dark mode so transparent dark logos remain visible */
  .pair figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px;
                 aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 8px; }
  .pair img { max-width: 100%; max-height: 100%; }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 12px; }
  button, input { font: inherit; }
  .answers button { padding: 14px 8px; border-radius: 8px; border: 2px solid currentColor;
                    background: var(--card); cursor: pointer; font-weight: 600; }
  .answers .yes { color: var(--yes); } .answers .no { color: var(--no); } .answers .unsure { color: var(--unsure); }
  .answers .chosen { outline: 3px solid var(--focus); outline-offset: 2px; }
  kbd { font-size: 12px; opacity: .7; margin-left: 4px; }
  nav { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  a { color: var(--focus); }
  .link { background: none; border: 0; color: var(--focus); cursor: pointer; padding: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px;
          max-width: 360px; margin: 48px auto; }
  .card label { display: block; margin: 12px 0 4px; }
  .card input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
                background: var(--bg); color: var(--fg); }
  .card button { margin-top: 16px; width: 100%; padding: 10px; border-radius: 6px; border: 0;
                 background: var(--focus); color: #fff; cursor: pointer; }
  .flash { color: var(--no); }
  table { border-collapse: collapse; margin: 8px 0 24px; font-size: 14px; display: block; overflow-x: auto; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: left; white-space: nowrap; }
  .muted { color: var(--muted); }
  h2 { font-size: 17px; margin-top: 24px; }
  main.wide { max-width: 1120px; }
  .welcome { max-width: 560px; }
  .primary { display: inline-block; padding: 10px 18px; border-radius: 6px; border: 0;
             background: var(--focus); color: #fff; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
{% block body %}{% endblock %}
</main>
</body>
</html>
