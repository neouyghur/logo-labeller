server {
    listen 80;
    server_name 203-101-229-244.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    # http2: one connection for the page and its images; each round trip costs ~0.3 s from
    # Turkey (the VM's nginx 1.24 predates the separate `http2 on;`)
    listen 443 ssl http2;
    server_name 203-101-229-244.sslip.io;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # written by `certbot --nginx -d 203-101-229-244.sslip.io`
    ssl_certificate     /etc/letsencrypt/live/203-101-229-244.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203-101-229-244.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # the audit autosave posts a whole sheet's state (task 2: about 1,000 items)
    client_max_body_size 4m;

    # only reachable through the app's X-Accel-Redirect, i.e. after the login check
    location /protected-images/ {
        internal;
        alias /srv/labelweb/images/;
        add_header Cache-Control "private, max-age=604800";
    }

    # audit sheet assets and tiles, only via the app's X-Accel-Redirect after the passcode check
    location /protected-audit/ {
        internal;
        alias /srv/labelweb/audit/;
        add_header Cache-Control "private, max-age=604800";
    }

    # public as before (Flask did not check the login either), but now cached for a day instead
    # of revalidated on every page; files here change only with a deploy
    location /static/ {
        alias /srv/labelweb/app/static/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
