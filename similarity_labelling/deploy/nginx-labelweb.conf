server {
    listen 80;
    server_name 203-101-229-244.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 203-101-229-244.sslip.io;

    # written by `certbot --nginx -d 203-101-229-244.sslip.io`
    ssl_certificate     /etc/letsencrypt/live/203-101-229-244.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203-101-229-244.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # the audit autosave posts a whole sheet's state (task 2: about 1,000 items)
    client_max_body_size 4m;

    # only reachable through the app's X-Accel-Redirect, i.e. after the login check
    location /protected-images/ {
        internal;
        alias /srv/labelweb/images/;
        add_header Cache-Control "private, max-age=604800";
    }

    # audit sheet assets and tiles, only via the app's X-Accel-Redirect after the passcode check
    location /protected-audit/ {
        internal;
        alias /srv/labelweb/audit/;
        add_header Cache-Control "private, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
